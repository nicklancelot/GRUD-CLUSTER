apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-frontend
  namespace: mern-app
  labels:
    app: mern-frontend
    tier: frontend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: mern-frontend
  
  template:
    metadata:
      labels:
        app: mern-frontend
        tier: frontend
      annotations:
        prometheus.io/scrape: "false"
    
    spec:
      serviceAccountName: mern-frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      
      affinity:
        # Pod Anti-affinity para alta disponibilidad
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mern-frontend
              topologyKey: "kubernetes.io/hostname"
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mern-frontend
              topologyKey: "topology.kubernetes.io/zone"
      
      terminationGracePeriodSeconds: 30
      
      imagePullSecrets:
      - name: dockerhub-secret
      
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USERNAME/mern-frontend:v1.0.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "50Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
            ephemeral-storage: "200Mi"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        
        startupProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
      
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
          items:
          - key: default.conf
            path: default.conf
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
      
      # Politica de tolerancia a fallos
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mern-frontend

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mern-frontend-sa
  namespace: mern-app

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mern-frontend-role
  namespace: mern-app
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mern-frontend-rolebinding
  namespace: mern-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mern-frontend-role
subjects:
- kind: ServiceAccount
  name: mern-frontend-sa
  namespace: mern-app

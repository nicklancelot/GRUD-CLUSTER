apiVersion: v1
kind: Secret
metadata:
  name: mern-db-secret
  namespace: mern-app
  labels:
    app: mern
type: Opaque
stringData:
  # MongoDB Atlas URI - À remplacer par votre vrai URI
  MONGO_URI: "mongodb+srv://mern_user:YOUR_PASSWORD@clustergrud.wkf8ntf.mongodb.net/mern_db?retryWrites=true&w=majority"
  MONGO_USER: "mern_user"
  MONGO_PASSWORD: "YOUR_SECURE_PASSWORD"
  MONGO_DB: "mern_db"

---
apiVersion: v1
kind: Secret
metadata:
  name: mern-app-secrets
  namespace: mern-app
  labels:
    app: mern
type: Opaque
stringData:
  # JWT Secret - À remplacer par une clé secrète sécurisée
  JWT_SECRET: "your-super-secure-jwt-secret-change-this-in-production"
  
  # Admin credentials
  ADMIN_EMAIL: "admin@mern-app.com"
  ADMIN_PASSWORD: "YOUR_SECURE_ADMIN_PASSWORD"
  
  # Frontend URL
  FRONTEND_URL: "https://mern-app.com"
  
  # Backend URL (for internal communication)
  BACKEND_URL: "http://mern-backend-service.mern-app.svc.cluster.local:5000"

---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: mern-app
type: kubernetes.io/dockercfg
data:
  # À générer avec: kubectl create secret docker-registry dockerhub-secret --docker-server=docker.io --docker-username=YOUR_USERNAME --docker-password=YOUR_PASSWORD --docker-email=YOUR_EMAIL -o yaml
  # .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG

